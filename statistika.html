<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статистика заходов — Электронный справочник конструктора</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="site-header.css">
<link rel="stylesheet" href="site-footer.css">
<style>
  :root{
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --surface2: #22263a;
    --border:   #2e3347;
    --accent:   #4f8ef7;
    --green:    #7dd3a8;
    --warn:     #f4b942;
    --red:      #ef4444;
    --text:     #d6daf0;
    --muted:    #6b7099;
    --mono:     'JetBrains Mono','Courier New',monospace;
    --sans:     'Inter','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    margin:0;
    line-height:1.55;
    font-size:14px;
  }
  .container{max-width:1100px;margin:0 auto;padding:24px 16px 64px;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .card-header{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:14px 20px;border-bottom:1px solid var(--border);
  }
  .card-header .title{font-size:15px;font-weight:700;color:#fff;}
  .card-header .hint{font-size:11.5px;color:var(--muted);}

  table.stats-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.stats-table th{
    text-align:left;padding:10px 20px;color:var(--muted);font-size:11px;
    text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);
  }
  table.stats-table th.num, table.stats-table td.num{text-align:right;}
  table.stats-table td{padding:9px 20px;border-bottom:1px solid var(--border);}
  table.stats-table tr:last-child td{border-bottom:none;}
  table.stats-table tr:nth-child(even) td{background:rgba(255,255,255,.02);}
  table.stats-table td.page{color:var(--text);}
  table.stats-table td.num{font-family:var(--mono);color:var(--green);}
  table.stats-table td.num.total{color:var(--accent);font-weight:700;}

  .state-msg{padding:24px 20px;color:var(--muted);text-align:center;font-size:13px;}
</style>
</head>
<body>

<div id="site-header"></div>

<div class="container">
  <div class="card">
    <div class="card-header">
      <span class="title">Статистика заходов</span>
      <span class="hint">анонимный счётчик просмотров, без привязки к пользователю</span>
    </div>
    <div id="statsBody">
      <div class="state-msg" id="statsMsg">Загрузка…</div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="site-structure.js"></script>
<script src="site-header.js"></script>
<script src="site-footer.js"></script>
<script>
  const VIEW_STATS_API_URL = 'https://rebar-backend-henna.vercel.app/api/view-stats';

  function render(pages){
    const body = document.getElementById('statsBody');
    if (!pages.length){
      body.innerHTML = '<div class="state-msg">Просмотров пока нет.</div>';
      return;
    }
    const rows = pages.map(p => `
      <tr>
        <td class="page">${escapeHtml(p.page)}</td>
        <td class="num">${p.today}</td>
        <td class="num">${p.month}</td>
        <td class="num total">${p.total}</td>
      </tr>
    `).join('');
    body.innerHTML = `
      <table class="stats-table">
        <thead>
          <tr>
            <th>Страница</th>
            <th class="num">Сегодня</th>
            <th class="num">Месяц</th>
            <th class="num">Всего</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  fetch(VIEW_STATS_API_URL)
    .then(r => r.json())
    .then(data => render(data.pages || []))
    .catch(() => {
      document.getElementById('statsMsg').textContent = 'Не удалось загрузить статистику.';
    });
</script>

</body>
</html>
