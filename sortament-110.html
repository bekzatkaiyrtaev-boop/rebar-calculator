    '1.3':'Двутавр', '1.4':'Двутавр для монорельсов',
    '1.5.1':'Двутавры Б и Ш', '1.5.2':'Двутавр К',
    '1.6':'Двутавр тонкостенный', '1.7':'Швеллер',
    '1.8':'Швеллер тонкостенный', '1.9':'Лист горячекатаный',
    '1.10':'Лист для фланцевых соединений', '1.11':'Лист рифлёный',
    '2.1':'Профиль замкнутый квадратный / прямоугольный', '2.2':'Профиль С-образный',
    '2.3':'Швеллер гнутый', '2.4':'Лист просечно-вытяжной'
  };
  const allGrades = [...new Set(data.sections.flatMap(s=>s.grades))];
  const currentSection = () => data.sections.find(s=>s.id === $('sectionSelect').value);
  function updateChoices() {
    const section = currentSection();
    const previousGrade = $('gradeSelect').value;
    $('profileSelect').disabled = !section;
    $('profileSelect').innerHTML = `<option value="">${section ? 'Все номера / размеры' : 'Сначала выберите вид проката'}</option>` + (section ? section.records.map(r => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.profileRaw || r.profile)}${r.warnings?.length ? ' · сверить обозначение':''}</option>`).join('') : '');
    $('profileLabel').textContent = section && ['1.9','1.10','1.11'].includes(section.id) ? 'Толщина листа, мм' : 'Номер / размер профиля';
    const grades = section ? section.grades : allGrades;
    $('gradeSelect').innerHTML = '<option value="">Все марки стали</option>' + grades.map(g=>`<option>${escapeHtml(g)}</option>`).join('');
    $('gradeSelect').value = grades.includes(previousGrade) ? previousGrade : '';
    render();
  }
  function render() {
    const section = currentSection();
    const sections = section ? [section] : data.sections;
    const profileId = $('profileSelect').value;
    const grade = $('gradeSelect').value;
    const mode = highlightMode(profileId,grade);
    $('tables').innerHTML = sections.map(s => `<section class="table-section" aria-labelledby="section-${s.id}"><div class="section-heading"><div><h2 class="section-title" id="section-${s.id}">${escapeHtml(s.id)}. ${escapeHtml(labels[s.id])}</h2><p class="section-standard">${escapeHtml(s.profileStandard)} · Сталь: ${escapeHtml(s.steelStandard)}</p></div><span class="table-count">${s.records.length} поз.</span></div>${renderTable(s,profileId,grade)}${(s.notes || []).map(n=>`<p class="section-note">${escapeHtml(n)}</p>`).join('')}${s.records.some(r=>r.warnings?.length) ? '<p class="section-note">! Обозначение «220х220250» сохранено как в исходнике и требует сверки.</p>':''}</section>`).join('');
    const count = sections.reduce((sum,s)=>sum+s.records.length,0);
    const messages = {none:'Все строки и марки стали.',row:'Подсвечена строка выбранного номера.',column:'Подсвечен столбец выбранной стали.',cell:'Подсвечена только ячейка на пересечении номера и стали.'};
    $('selectionSummary').textContent = `${section ? labels[section.id] : 'Весь сортамент'} · ${count} поз. ${messages[mode]}`;
  }
  $('sectionSelect').innerHTML = '<option value="">Все виды проката</option>' + data.sections.map(s=>`<option value="${s.id}">${escapeHtml(labels[s.id])} · ${escapeHtml(s.profileStandard)}</option>`).join('');
  $('sectionSelect').addEventListener('change',updateChoices);
  $('profileSelect').addEventListener('change',render);
  $('gradeSelect').addEventListener('change',render);
  $('resetBtn').addEventListener('click',() => {$('sectionSelect').value='';$('gradeSelect').value='';updateChoices();});
    $('sourceInfo').innerHTML = `<p>${escapeHtml(data.source.title)}</p><p>Исходный файл: ${escapeHtml(data.source.filename)}</p><p>Обозначения, марки стали и знаки перенесены из предоставленного DOCX. Проверено 217 позиций и 1020 сочетаний.</p><p>Наличие в таблице означает наличие в приложенном сортаменте. Данные о складских остатках и актуальности документа не проверяются.</p><p class="hash">SHA-256: ${escapeHtml(data.source.sha256)}</p>`;
  updateChoices();
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script src="site-structure.js"></script>
<script src="site-header.js"></script>
<script src="site-footer.js"></script>
